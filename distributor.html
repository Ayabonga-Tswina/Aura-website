<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura — Become a Distributor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo-link">
            <img src="Aura_files/2.png" alt="Aura Logo" class="logo-img">
        </a>
        <ul class="menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="distributor.html" class="active">Become a Distributor</a></li>
            <li><a href="contact.html">Contact Us</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>

    <main class="container">
        <div class="form-card">
            <h1>Become a Distributor</h1>
            <p>Join the Aura family and grow your business with us.</p>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="fname">First Name</label>
                    <input type="text" id="fname" name="firstname" required placeholder="Your first name">
                </div>
                <div class="form-group">
                    <label for="lname">Last Name</label>
                    <input type="text" id="lname" name="lastname" required placeholder="Your last name">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="contact">Contact Number</label>
                    <input type="tel" id="contact" name="contact" required placeholder="e.g. 071 234 5678">
                </div>
                <div class="form-group">
                    <label for="address">Physical Address</label>
                    <textarea id="address" name="address" rows="3" required placeholder="Your full address"></textarea>
                </div>
                <div class="form-group">
                    <label for="reason">Why do you want to become a distributor?</label>
                    <textarea id="reason" name="reason" rows="4" required placeholder="Tell us about your goals and experience..."></textarea>
                </div>
                <button type="submit" class="btn-primary">Submit Application</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Aura Beauty. All rights reserved.</p>
    </footer>
</body>
</html>
