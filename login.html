<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura — Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo-link">
            <img src="2.png" alt="Aura Logo" class="logo-img">
        </a>
        <ul class="menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="distributor.html">Become a Distributor</a></li>
            <li><a href="contact.html">Contact Us</a></li>
            <li><a href="login.html" class="active">Login</a></li>
        </ul>
    </nav>

    <main class="container">
        <div class="form-card login-card">
            <h1>Welcome Back</h1>
            <p>Login to your Aura account.</p>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('customer')">Customer</button>
                <button class="tab-btn" onclick="switchTab('distributor')">Distributor</button>
            </div>

            <form action="#" method="POST" id="login-form">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" name="email" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary">Login</button>
            </form>

            <div class="login-links">
                <a href="#">Forgot Password?</a>
                <span>|</span>
                <a href="#">Create an Account</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Aura Beauty. All rights reserved.</p>
    </footer>

    <script>
        function switchTab(type) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            // In a real app, this would switch the form action or fields
        }
    </script>
</body>
</html>
